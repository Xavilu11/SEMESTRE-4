{% extends "base.html" %}

{% block title %}Formulario de Usuario{% endblock %}

{% block content %}
  <h2 class="mb-4">Formulario de Usuario</h2>

  <!-- Formulario HTML puro -->
  <!-- Este formulario sirve tanto para editar como para crear usuarios -->
  <form method="POST">
      <!-- Campo Nombre -->
      <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" id="nombre" name="nombre" class="form-control"
                 value="{{ usuario.nombre if usuario else '' }}">
      </div>

      <!-- Campo Email -->
      <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="text" id="email" name="email" class="form-control"
                 value="{{ usuario.email if usuario else '' }}">
      </div>

      <!-- Campo Contraseña -->
      <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" id="password" name="password" class="form-control">
      </div>

      <!-- Botones -->
      <div class="mb-3">
          <button type="submit" class="btn btn-success">Guardar</button>
          <a href="{{ url_for('mostrar_usuarios') }}" class="btn btn-secondary">Cancelar</a>
      </div>
  </form>
{% endblock %}
