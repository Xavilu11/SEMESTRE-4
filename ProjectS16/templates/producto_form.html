{% extends "base.html" %}

{% block title %}Formulario de Producto{% endblock %}

{% block content %}
  <h2 class="mb-4">Formulario de Producto</h2>

  <!-- Formulario HTML puro -->
  <!-- Este formulario sirve tanto para crear como para editar productos -->
  <form method="POST">
      <!-- Campo Nombre -->
      <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" id="nombre" name="nombre" class="form-control" 
                 value="{{ producto.nombre if producto else '' }}">
      </div>

      <!-- Campo Precio -->
      <div class="mb-3">
          <label for="precio" class="form-label">Precio</label>
          <input type="text" id="precio" name="precio" class="form-control" 
                 value="{{ producto.precio if producto else '' }}">
      </div>

      <!-- Campo Stock -->
      <div class="mb-3">
          <label for="stock" class="form-label">Stock</label>
          <input type="text" id="stock" name="stock" class="form-control" 
                 value="{{ producto.stock if producto else '' }}">
      </div>

      <!-- Botones -->
      <div class="mb-3">
          <button type="submit" class="btn btn-success">Guardar</button>
          <a href="{{ url_for('listar_productos_view') }}" class="btn btn-secondary">Cancelar</a>
      </div>
  </form>
{% endblock %}
