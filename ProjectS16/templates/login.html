{% extends "base.html" %}

{% block title %}Iniciar Sesión - Harta Pinta{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">Iniciar Sesión</h2>
    <p class="text-center">Please log in to access this page.</p>

    <!-- Formulario de login -->
    <form method="POST" action="{{ url_for('login') }}" autocomplete="off">
        <!-- Campo Email -->
        <div class="mb-3">
            <label for="email">Email:</label>
            <input type="email" class="form-control" id="email" name="email" 
                   autocomplete="off" value="">
        </div>

        <!-- Campo Contraseña -->
        <div class="mb-3">
            <label for="password">Contraseña:</label>
            <input type="password" class="form-control" id="password" name="password" 
                   autocomplete="new-password" value="">
        </div>

        <!-- Botón Ingresar -->
        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>

    <!-- Link de registro -->
    <div class="text-center mt-3">
        <a href="{{ url_for('register') }}">¿No tienes cuenta? Regístrate aquí.</a>
    </div>
</div>
{% endblock %}
